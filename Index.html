<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perpustakaan Digital</title>
<meta name="theme-color" content="#4F63E6">
<link rel="manifest" href='data:application/manifest+json,{"name":"Perpustakaan Digital","short_name":"Perpus","start_url":".","display":"standalone","background_color":"%23ffffff","theme_color":"%234F63E6"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#4F63E6;--primary-d:#3F51CC;--navy:#1E2B5E;--orange:#F97316;--text:#111827;--muted:#9CA3AF;--border:#EEF0F4;--ok:#16A34A;--bad:#E11D48;--warn:#D97706}
:where(#perpus-root),:where(#perpus-root) *{box-sizing:border-box;margin:0;padding:0}
html.perpus-lock,html.perpus-lock body{overflow:hidden!important}
#perpus-root{position:fixed;inset:0;z-index:2147483647;font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:linear-gradient(160deg,#9FD3F0 0%,#CFEAF7 55%,#BFE3DA 100%);overflow:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
:where(#perpus-root) button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:where(#perpus-root) input,:where(#perpus-root) select,:where(#perpus-root) textarea{font:inherit;color:inherit}
:where(#perpus-root) svg{flex:none}
[hidden]{display:none!important}

/* ===== LOGIN ===== */
.login-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.login-card{display:flex;width:min(900px,100%);min-height:520px;border-radius:32px;overflow:hidden;background:rgba(255,255,255,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(30,43,94,.18)}
.login-art{flex:1;position:relative;color:#fff;padding:40px 36px;background:linear-gradient(180deg,#3E9BE6 0%,#7CC4F0 60%,#BFE6F5 100%);overflow:hidden;min-height:200px}
.login-art h1{font-size:36px;line-height:1.1;font-weight:600;position:relative}
.login-art p{position:relative;margin-top:10px;opacity:.95;max-width:260px}
.login-art .illu{position:absolute;left:0;right:0;bottom:0;height:62%}
.login-art .illu svg{width:100%;height:100%}
.login-form{flex:1;padding:40px 36px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login-form h2{font-size:26px;font-weight:600}
.login-form .sub{color:var(--muted);margin-top:-8px}
.seg{display:flex;background:#EEF1FF;border-radius:999px;padding:4px}
.seg button{flex:1;padding:9px 12px;border-radius:999px;color:#6B7280;font-weight:500;transition:.2s}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 4px 14px rgba(79,99,230,.18)}
.hint{background:#F5F7FF;border:1px dashed #C7D0FF;border-radius:14px;padding:10px 14px;font-size:12px;color:#4B5563}
.hint b{color:var(--primary)}
.err-box{background:#FFF1F2;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:13px}

/* ===== FORM ===== */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:500;color:#4B5563}
.fld small{font-size:11px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 14px;border:1px solid #E5E7EB;border-radius:14px;background:#fff;outline:none;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,99,230,.12)}
.fld textarea{resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full,.form-grid .m-title,.form-grid .m-act{grid-column:1/-1}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--primary);color:#fff!important;font-weight:500;transition:.2s;box-shadow:0 8px 20px rgba(79,99,230,.28);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--primary-d);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;color:var(--primary)!important;box-shadow:inset 0 0 0 1px #DDE2FF;border:0}
.btn.ghost:hover{background:#F5F7FF}
.btn.danger{background:var(--bad);box-shadow:0 8px 20px rgba(225,29,72,.25)}
.btn.sm{padding:7px 14px;font-size:12px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:#fff;color:var(--primary);font-weight:500;box-shadow:0 8px 24px rgba(30,43,94,.1);transition:.2s;white-space:nowrap}
.pill:hover{transform:translateY(-2px)}
.ib{width:34px;height:34px;border-radius:12px;display:inline-grid;place-items:center;color:#6B7280;background:#F3F4F6;transition:.2s}
.ib:hover{background:#EEF1FF;color:var(--primary)}
.ib.red:hover{background:#FFE4E8;color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ===== SHELL ===== */
.shell{position:absolute;inset:24px;display:flex;border-radius:32px;overflow:hidden;background:rgba(255,255,255,.84);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(30,43,94,.18)}
.sidebar{width:88px;flex:none;margin:14px 0 14px 14px;border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:18px 0;box-shadow:0 8px 30px rgba(30,43,94,.08)}
.logo{text-align:center;line-height:1.1;margin-bottom:22px}
.logo b{display:block;font-size:16px;font-weight:700;color:var(--navy)}
.logo small{font-size:9px;color:var(--muted)}
.navs{display:flex;flex-direction:column;gap:6px;width:100%;flex:1;overflow-y:auto;scrollbar-width:none}
.nv{position:relative;width:100%;height:48px;display:grid;place-items:center;color:var(--muted)}
.nv span{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;transition:.2s}
.nv:hover span{background:#F3F4F6;color:var(--navy)}
.nv.on{color:var(--primary)}
.nv.on span{background:#EEF1FF}
.nv.on:after{content:'';position:absolute;right:0;top:11px;bottom:11px;width:3px;border-radius:3px 0 0 3px;background:var(--primary)}
.nv .tip{position:absolute;left:78px;background:var(--navy);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s;z-index:5}
.nv:hover .tip{opacity:1}
.main{flex:1;min-width:0;overflow-y:auto;padding:22px 32px 40px;scroll-behavior:smooth}
.top{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:26px}
.search{flex:1;display:flex;align-items:center;gap:10px;color:var(--navy)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:8px 0}
.search input::placeholder{color:#6B7280}
.bell{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#6B7280}
.bell:hover{background:#F3F4F6}
.bell i{position:absolute;top:6px;right:8px;min-width:9px;height:9px;border-radius:9px;background:var(--bad);border:2px solid #fff}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;background:linear-gradient(135deg,#F59E0B,#EF4444)}
.avatar.sm{width:30px;height:30px;font-size:11px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.15}
.h2{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:30px 0 14px;color:var(--text)}
.h2 span{color:var(--muted);font-weight:500}
.h3{font-size:18px;font-weight:600;margin:26px 0 12px}
.panel{width:300px;flex:none;position:relative;color:#fff;background:linear-gradient(180deg,#3E9BE6 0%,#7CC4F0 55%,#BFE6F5 100%);overflow:hidden;padding:36px 28px;margin:0}
.panel .illu{position:absolute;left:0;right:0;bottom:0;height:68%;pointer-events:none}
.panel .illu svg{width:100%;height:100%}
.panel>*:not(.illu){position:relative}
.p-tag{display:block;opacity:.85;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.panel h2{font-size:27px;line-height:1.15;font-weight:600;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.panel .big{font-size:36px;font-weight:600;margin-top:16px;line-height:1}
.panel .big span{font-size:12px;font-weight:400;opacity:.9;margin-left:6px}
.p-line{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:10px;opacity:.95}
.panel .btn{position:absolute;bottom:28px;left:50%;transform:translateX(-50%)}
.panel .btn:hover{transform:translateX(-50%) translateY(-1px)}

/* ===== STAT CARDS ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.stat{position:relative;height:172px;border-radius:22px;padding:18px 20px;color:#fff;overflow:hidden;transition:.25s;box-shadow:0 12px 30px rgba(30,43,94,.12)}
.stat:hover{transform:translateY(-4px)}
.stat .ill{position:absolute;inset:0}
.stat .ill svg{width:100%;height:100%}
.stat:after{content:'';position:absolute;inset:auto 0 0 0;height:96px;background:linear-gradient(transparent,rgba(0,0,0,.3))}
.stat h3{position:relative;z-index:2;font-size:19px;font-weight:600;line-height:1.2;max-width:140px}
.stat .pc{position:absolute;z-index:2;left:20px;bottom:36px;font-size:28px;font-weight:600;line-height:1}
.stat .sub{position:absolute;z-index:2;left:20px;bottom:14px;font-size:11px;opacity:.95}
.stat .bar{position:absolute;z-index:2;left:20px;right:20px;bottom:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.stat .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .8s}
.c-green{background:linear-gradient(180deg,#4DA8E8,#8FD3F0)}
.c-purple{background:linear-gradient(180deg,#A78BFA,#8B5CF6)}
.c-coral{background:linear-gradient(180deg,#F0647E,#F59E6B)}
.c-blue{background:linear-gradient(180deg,#38BDF8,#4F63E6)}

/* ===== TIMELINE ===== */
.tl-scroll{overflow-x:auto;padding-bottom:10px}
.tl{position:relative;min-width:100%}
.tl-h{position:relative;height:30px}
.tl-h span{position:absolute;top:0;width:52px;text-align:center;font-size:11px;color:#6B7280;padding:4px 0;border-radius:999px}
.tl-h span.on{background:var(--navy);color:#fff;font-weight:500}
.tl-b{position:relative;margin-top:12px;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 71px,#F1F3F8 71px,#F1F3F8 72px);background-position:26px 0}
.tl-now{position:absolute;top:-8px;bottom:0;width:1px;background:#9F7AEA;z-index:3}
.tl-now:before{content:'';position:absolute;top:0;left:-5px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-sizing:border-box}
.tl-it{position:absolute;width:250px;height:52px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(30,43,94,.1);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px 0 20px;z-index:2}
.tl-it small{display:block;font-size:10px;color:#6B7280;line-height:1.2}
.tl-it b{display:block;font-size:12px;font-weight:600;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-it.hot{background:var(--primary);color:#fff}
.tl-it.hot small{color:#DDE2FF}

/* ===== BOOKS ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;margin-bottom:6px}
.chip{padding:8px 16px;border-radius:999px;background:#fff;color:#4B5563;white-space:nowrap;box-shadow:0 2px 10px rgba(30,43,94,.06);transition:.2s;font-size:13px}
.chip.on{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(79,99,230,.28)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:20px}
.bcard{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 26px rgba(30,43,94,.08);cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.bcard:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(30,43,94,.14)}
.bc-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.bc-cat{font-size:10px;color:var(--primary);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.bc-title{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-author{font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.cover{position:relative;aspect-ratio:3/4;display:grid;place-items:center;color:#fff;overflow:hidden}
.cover .cv-in{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;text-align:center;font-size:12px;font-weight:600;line-height:1.25;opacity:.95}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.mini{width:40px;aspect-ratio:3/4;border-radius:8px;flex:none}
.cover.mini .cv-in{display:none}
.cover.lg{width:100%;border-radius:20px}
.hscroll{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.hscroll .bcard{width:168px;flex:none;scroll-snap-align:start}
.heart{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#F3F4F6;color:#9CA3AF;transition:.2s}
.heart.on{background:#FFE4E8;color:var(--bad)}
.heart.on svg{fill:currentColor}

/* ===== BADGES / LISTS ===== */
.bd{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.bd.ok{background:#DCFCE7;color:#15803D}
.bd.bad{background:#FFE4E8;color:#BE123C}
.bd.info{background:#E0E7FF;color:#4338CA}
.bd.warn{background:#FEF3C7;color:#B45309}
.bd.gray{background:#F3F4F6;color:#4B5563}
.plist{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:10px 18px 10px 10px;box-shadow:0 8px 24px rgba(30,43,94,.08)}
.prow.block{border-radius:20px;align-items:flex-start;padding:14px}
.prow .pl-l{flex:1;min-width:0}
.prow small{display:block;font-size:11px;color:#6B7280}
.prow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow.block b{white-space:normal}
.tabs{display:flex;gap:6px;background:#EEF1FF;border-radius:999px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.tabs button{padding:8px 16px;border-radius:999px;color:#6B7280;white-space:nowrap;font-size:13px}
.tabs button.on{background:#fff;color:var(--primary);box-shadow:0 4px 12px rgba(79,99,230,.15);font-weight:500}
.tw{background:#fff;border-radius:22px;box-shadow:0 8px 28px rgba(30,43,94,.07);overflow-x:auto}
.tw table{width:100%;border-collapse:collapse;min-width:640px}
.tw th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:14px 16px;border-bottom:1px solid var(--border)}
.tw td{padding:12px 16px;border-bottom:1px solid #F6F7FA;vertical-align:middle;font-size:13px}
.tw tr:last-child td{border-bottom:0}
.tw tbody tr:hover{background:#FAFBFF}
.cellbook,.cellusr{display:flex;align-items:center;gap:12px;min-width:0}
.cellbook b,.cellusr b{display:block;font-weight:600;line-height:1.3}
.cellbook small,.cellusr small{color:#6B7280;font-size:11px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.kcard{display:flex;align-items:center;gap:14px;background:#fff;padding:16px;border-radius:20px;box-shadow:0 8px 24px rgba(30,43,94,.07)}
.kcard>i{width:14px;height:44px;border-radius:8px;flex:none}
.kcard>div:nth-child(2){flex:1;min-width:0}
.kcard b{display:block}
.kcard small{color:#6B7280}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:44px 16px;color:var(--muted);background:rgba(255,255,255,.6);border-radius:22px}
.empty.small{padding:18px}
.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 28px rgba(30,43,94,.07)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:#6B7280}
.kv dd{font-weight:500;word-break:break-word}
.rank{display:flex;flex-direction:column;gap:10px}
.rank div{display:flex;align-items:center;gap:10px;font-size:13px}
.rank em{font-style:normal;width:24px;height:24px;border-radius:50%;background:#EEF1FF;color:var(--primary);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.rank span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px;overflow-x:auto;padding-top:10px}
.bars div{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:9px;color:#6B7280}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#7C8CF0,var(--primary));min-height:3px}

/* ===== FAB / BOTTOM NAV ===== */
.fab{position:absolute;right:calc(300px + 42px);bottom:44px;width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;box-shadow:0 12px 28px rgba(249,115,22,.45);z-index:20;transition:.2s}
.fab:hover{transform:scale(1.08) rotate(90deg)}
.bnav{display:none}

/* ===== MODAL / TOAST ===== */
.ov{position:absolute;inset:0;z-index:100;background:rgba(17,24,39,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:18px;animation:fade .2s}
.modal{background:#fff;border-radius:28px;padding:26px;width:min(560px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .25s}
.modal.wide{width:min(760px,100%)}
.m-title{font-size:21px;font-weight:600;margin-bottom:4px}
.m-p{color:#4B5563;margin:8px 0 18px}
.m-act{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.bd-wrap{display:grid;grid-template-columns:180px 1fr;gap:22px}
.bd-info h3{font-size:22px;line-height:1.25;font-weight:600}
.bd-info .au{color:#6B7280;margin:2px 0 12px}
.bd-info p{color:#4B5563;font-size:13px;margin:12px 0}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:200;background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;box-shadow:0 14px 34px rgba(0,0,0,.25);animation:pop .25s;max-width:92vw;text-align:center}
.toast.err{background:var(--bad)}
.busy{position:absolute;top:0;left:0;right:0;height:3px;z-index:300;background:linear-gradient(90deg,transparent,var(--primary),transparent);background-size:200% 100%;animation:slide 1s linear infinite}
.sk{border-radius:20px;background:linear-gradient(90deg,#F1F3F8 25%,#E7EAF3 50%,#F1F3F8 75%);background-size:200% 100%;animation:slide 1.2s linear infinite}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slide{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== SCAN / KARTU / BRANDING ===== */
#ov2{z-index:150}
.modal.scan{width:min(460px,100%)}
.scan-view{position:relative;border-radius:20px;overflow:hidden;background:#0F172A;aspect-ratio:4/3;display:grid;place-items:center}
.scan-view video{width:100%;height:100%;object-fit:cover}
#scR{width:100%}
.scan-frame{position:absolute;inset:18% 10%;border:2px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.28);pointer-events:none}
.scan-frame:after{content:'';position:absolute;left:5%;right:5%;top:50%;height:2px;background:var(--orange);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
.scan-manual{display:flex;gap:8px;margin-top:12px}
.scan-manual input{flex:1;min-width:0;padding:10px 16px;border:1px solid #E5E7EB;border-radius:999px;outline:none}
.scan-manual input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,99,230,.12)}
.scanrow{display:flex;gap:8px;align-items:center}
.scanrow input{flex:1;min-width:0}

function barcodeSvg(text,h=40){
 const s=String(text==null?'':text).replace(/[^\x20-\x7e]/g,'?');
 if(!s)return '';
 const codes=[104];for(const ch of s)codes.push(ch.charCodeAt(0)-32);
 let chk=104;for(let i=1;i<codes.length;i++)chk+=codes[i]*i;
 codes.push(chk%103,106);
 let x=10,d='';
 for(const c of codes){const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)d+=`M${x} 0h${w}v${h}h-${w}z`;x+=w;}}
 const W=x+10;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="Barcode ${esc(s)}"><rect width="${W}" height="${h}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;

 async sel(t){
  if(IS_PREVIEW)return JSON.parse(JSON.stringify(MOCK[t]));
  let all=[],from=0;
  for(;;){
   const {data,error}=await sb.from(t).select('*').order('id').range(from,from+999);
   if(error)throw error;
   all=all.concat(data||[]);
   if(!data||data.length<1000||from>=100000)break;
   from+=1000;
  }
  return all;
 },
async ins(t,row){
  if(IS_PREVIEW){const r={id:uid(),created_at:new Date().toISOString(),...row};MOCK[t].push(r);return r;}
  const {data,error}=await sb.from(t).insert(row).select().single();
  if(error)throw error;return data;
 },
 async upd(t,id,p){
  if(IS_PREVIEW){const r=MOCK[t].find(x=>x.id===id);if(!r)throw new Error('Data tidak ditemukan');Object.assign(r,p);return r;}
  const {data,error}=await sb.from(t).update(p).eq('id',id).select().single();
  if(error)throw error;return data;
 },
 async del(t,id){
  if(IS_PREVIEW){
   MOCK[t]=MOCK[t].filter(x=>x.id!==id);
   if(t==='buku'){['peminjaman','reservasi','favorit'].forEach(k=>MOCK[k]=MOCK[k].filter(x=>x.buku_id!==id));MOCK.pengunjung.forEach(v=>{if(v.buku_id===id)v.buku_id=null;});}
   if(t==='anggota'){['peminjaman','reservasi','favorit'].forEach(k=>MOCK[k]=MOCK[k].filter(x=>x.anggota_id!==id));MOCK.pengunjung.forEach(v=>{if(v.anggota_id===id)v.anggota_id=null;});}
   if(t==='kategori'){MOCK.buku.forEach(b=>{if(b.kategori_id===id)b.kategori_id=null;});}
   if(t==='sumber_buku'){MOCK.buku.forEach(b=>{if(b.sumber_id===id)b.sumber_id=null;});}
   return;
  }
  const {error}=await sb.from(t).delete().eq('id',id);
  if(error)throw error;
 }
};
async function rpc(name,args){
 const {data,error}=await sb.rpc(name,args);
 if(error)throw new Error(error.message||'Gagal memproses permintaan');
 return data;
}

  if(IS_PREVIEW){

 },
 async changePw(oldPw,newPw){

  await rpc('ubah_password_anggota',{p_id:S.user.id,p_hash_lama:ho,p_hash_baru:hn});
  S.hash=hn;
 }
};

function loanInfo(l){
 const P=S.settings;
 if(l.tgl_kembali)return {key:'kembali',label:'Dikembalikan',cls:'ok',late:0,denda:Number(l.denda||0)};
 const late=Math.max(0,diffDays(todayStr(),l.tgl_jatuh_tempo));
 if(late>0)return {key:'terlambat',label:`Terlambat ${late} hari`,cls:'bad',late,denda:late*P.denda_per_hari};
 const sisa=diffDays(l.tgl_jatuh_tempo,todayStr());
 return {key:'dipinjam',label:sisa===0?'Jatuh tempo hari ini':`Sisa ${sisa} hari`,cls:sisa<=1?'warn':'info',late:0,denda:0,sisa};
}
async function doPinjam(anggota_id,buku_id,tgl){
 const b=S.d.buku.find(x=>x.id===buku_id);
 if(!b||b.stok_tersedia<1)throw new Error('Stok buku habis');
 const aktif=S.d.peminjaman.filter(p=>p.anggota_id===anggota_id&&!p.tgl_kembali);
 if(aktif.length>=S.settings.maks_pinjam)throw new Error(`Anggota sudah mencapai batas ${S.settings.maks_pinjam} pinjaman`);
 if(aktif.some(p=>p.buku_id===buku_id))throw new Error('Anggota sedang meminjam buku yang sama');
 await A.ins('peminjaman',{anggota_id,buku_id,tgl_pinjam:tgl,tgl_jatuh_tempo:addDays(tgl,S.settings.lama_pinjam_hari),tgl_kembali:null,status:'dipinjam',denda:0,perpanjangan:0});
 await A.upd('buku',buku_id,{stok_tersedia:b.stok_tersedia-1});
}
async function doKembali(id){
 const l=S.d.peminjaman.find(x=>x.id===id);if(!l||l.tgl_kembali)throw new Error('Pinjaman sudah dikembalikan');
 const info=loanInfo(l);
 await A.upd('peminjaman',id,{tgl_kembali:todayStr(),status:'kembali',denda:info.denda,dikembalikan_at:new Date().toISOString()});
 const b=S.d.buku.find(x=>x.id===l.buku_id);
 if(b)await A.upd('buku',b.id,{stok_tersedia:Math.min(b.stok_total,b.stok_tersedia+1)});
 return {denda:info.denda,antri:S.d.reservasi.filter(r=>r.buku_id===l.buku_id&&r.status==='menunggu').length};
}
async function doPerpanjang(id){
 const l=S.d.peminjaman.find(x=>x.id===id),P=S.settings;
 if(!l||l.tgl_kembali)throw new Error('Pinjaman tidak aktif');
 if(loanInfo(l).late>0)throw new Error('Pinjaman sudah terlambat, tidak bisa diperpanjang');
 if((l.perpanjangan||0)>=P.maks_perpanjang)throw new Error('Batas perpanjangan sudah tercapai');
 await A.upd('peminjaman',id,{tgl_jatuh_tempo:addDays(l.tgl_jatuh_tempo,P.lama_pinjam_hari),perpanjangan:(l.perpanjangan||0)+1});
}

 }).join('');

function timelineHtml(){
 const t=todayStr(),COL=72,H0=7,H1=19,ev=[];
 S.d.peminjaman.forEach(l=>{
  const a=S.d.anggota.find(x=>x.id===l.anggota_id),b=S.d.buku.find(x=>x.id===l.buku_id);if(!a||!b)return;
  if(l.created_at&&ymd(new Date(l.created_at))===t)ev.push({at:new Date(l.created_at),k:'Dipinjam',title:b.judul,who:a.nama});
  if(l.dikembalikan_at&&ymd(new Date(l.dikembalikan_at))===t)ev.push({at:new Date(l.dikembalikan_at),k:'Dikembalikan',title:b.judul,who:a.nama});
 });
 ev.sort((x,y)=>x.at-y.at);
 const now=new Date(),nh=Math.min(H1,Math.max(H0,now.getHours()+now.getMinutes()/60));
 const hours=[];for(let h=H0;h<=H1;h++)hours.push(h);
 let latest=ev.findIndex(e=>e.at>=now);if(latest<0)latest=ev.length-1;
 const ends=[];let items='';
 ev.forEach((e,i)=>{
  const hh=Math.min(H1+.3,Math.max(H0,e.at.getHours()+e.at.getMinutes()/60)),left=(hh-H0)*COL;
  let r=0;while(ends[r]!==undefined&&ends[r]>left-12)r++;ends[r]=left+250;

function lapRange(){
 if(!S.f.from){const n=new Date();S.f.from=ymd(new Date(n.getFullYear(),n.getMonth(),1));S.f.to=todayStr();}
 return [S.f.from,S.f.to];
}
function lapLoans(){const [f,t]=lapRange();return S.d.peminjaman.filter(l=>l.tgl_pinjam>=f&&l.tgl_pinjam<=t);}
function lapVisits(){const [f,t]=lapRange();return (S.d.pengunjung||[]).filter(v=>v.tanggal>=f&&v.tanggal<=t);}
function lapStats(){
 const [f,t]=lapRange(),L=lapLoans(),V=lapVisits();
 const cnt=key=>{const c={};L.forEach(l=>c[l[key]]=(c[l[key]]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);};
 return {f,t,L,V,
  kembali:S.d.peminjaman.filter(l=>l.tgl_kembali&&l.tgl_kembali>=f&&l.tgl_kembali<=t).length,
  telat:L.filter(l=>loanInfo(l).late>0||(l.tgl_kembali&&Number(l.denda)>0)).length,
  denda:sum(L,l=>loanInfo(l).denda),
  topBuku:cnt('buku_id'),topAng:cnt('anggota_id'),
  vAng:V.filter(v=>v.anggota_id).length,vTamu:V.filter(v=>!v.anggota_id).length,
  vHari:new Set(V.map(v=>v.tanggal)).size};
}

 openForm({title:b?'Ubah Buku':'Tambah Buku',wide:true,values:b||{stok_total:1,kode_buku:nextKode()},submitLabel:b?'Simpan Perubahan':'Tambah Buku',
  fields:[
   {name:'kode_buku',label:'Kode buku',scanTo:true,full:true,placeholder:'Scan barcode / QR buku, atau ketik',hint:'Satu kode per judul. Dipakai untuk scan saat sirkulasi. Kosongkan jika tidak dipakai.'},
   {name:'judul',label:'Judul',required:true,full:true},{name:'penulis',label:'Penulis',required:true},{name:'penerbit',label:'Penerbit'},
   {name:'kategori_id',label:'Kategori',type:'select',options:[{v:'',t:'Tanpa kategori'},...S.d.kategori.map(k=>({v:k.id,t:k.nama}))]},

   {name:'sinopsis',label:'Sinopsis',type:'textarea',full:true}
  ],
  onSubmit:async fd=>{
   const total=Math.max(0,parseInt(fd.stok_total)||0);
   const kode=fd.kode_buku.trim();
   if(kode&&S.d.buku.some(x=>String(x.kode_buku||'').toLowerCase()===kode.toLowerCase()&&x.id!==id))throw new Error('Kode buku sudah dipakai buku lain');

/* ===== PENCARIAN KODE & SCANNER ===== */
function resolveMember(code){
 const c=String(code).trim(),l=c.toLowerCase();
 return S.d.anggota.find(a=>String(a.no_anggota).toLowerCase()===l||a.username===l||a.id===c);
}
function resolveBook(code){
 const c=String(code).trim(),l=c.toLowerCase(),dg=l.replace(/[^0-9x]/g,'');
 return S.d.buku.find(b=>String(b.kode_buku||'').toLowerCase()===l||b.id===c||(dg.length>=10&&String(b.isbn||'').toLowerCase().replace(/[^0-9x]/g,'')===dg));
}
function applyScan(kind,code,ctx={}){
 const form=$('#frmModal');if(!form)return;
 code=String(code||'').trim();if(!code)return;
 const hint=$(`[data-for="${kind}"]`,form),inp=$(`[data-scan="${kind}"]`,form);
 const setHint=(t,ok)=>{if(hint){hint.textContent=t;hint.style.color=ok?'var(--ok)':'var(--bad)';}};
 if(kind==='kode'){const el=form.elements[ctx.fill];if(el){el.value=code;el.dispatchEvent(new Event('input',{bubbles:true}));}return;}
 if(inp)inp.value=code;
 const sel=form.elements[ctx.target];if(!sel)return;
 let item,label;
 if(kind==='anggota'){
  item=resolveMember(code);
  if(!item){setHint('Anggota tidak ditemukan: '+code,false);return toast('Anggota tidak ditemukan','err');}
  if(item.status!=='aktif'){setHint(`${item.nama} berstatus nonaktif`,false);return toast('Anggota nonaktif','err');}
  label=`${item.nama} (${item.no_anggota})`;
 }else{
  item=resolveBook(code);
  if(!item){setHint('Buku tidak ditemukan: '+code,false);return toast('Buku tidak ditemukan','err');}
  label=item.judul;
 }
 if(![...sel.options].some(o=>o.value===item.id)){setHint(`${label} tidak bisa dipilih (stok habis?)`,false);return toast(kind==='buku'?`Stok "${item.judul}" habis`:'Tidak bisa dipilih','err');}
 sel.value=item.id;setHint('✓ '+label,true);
 const next=$$('[data-scan]',form).find(i=>i.dataset.scan!==kind&&!i.value);
 if(next)next.focus();
}
let SCAN=null;
function closeScanner(){
 const s=SCAN;SCAN=null;
 if(s)s.stop.forEach(f=>{try{f();}catch(_){}});
 const o=$('#ov2');if(o){o.hidden=true;o.innerHTML='';}
}
const loadScript=src=>new Promise((res,rej)=>{
 if(window.Html5Qrcode)return res();
 const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Pustaka scanner gagal dimuat (periksa koneksi internet)'));document.head.appendChild(s);
});
async function openScanner(title,cb){
 closeScanner();
 const o=$('#ov2'),me={stop:[]};SCAN=me;
 o.innerHTML=`<div class="modal scan" role="dialog" aria-modal="true"><h3 class="m-title">${esc(title)}</h3><p class="m-p" id="scMsg" style="margin:6px 0 12px">Menyiapkan kamera...</p><div class="scan-view" id="scView"><video id="scV" playsinline muted hidden></video><div id="scR" hidden></div><div class="scan-frame" id="scFrame"></div></div><form id="scManual" class="scan-manual"><input id="scIn" placeholder="Atau ketik / scan dengan alat scanner" autocomplete="off" aria-label="Kode"><button class="btn sm" type="submit">OK</button></form><div class="m-act" style="margin-top:14px"><button class="btn ghost" type="button" data-act="closeScan">Tutup</button></div></div>`;
 o.hidden=false;
 let done=false;
 const msg=t=>{const m=$('#scMsg');if(m)m.textContent=t;};
 const finish=txt=>{txt=String(txt||'').trim();if(done||!txt||SCAN!==me)return;done=true;closeScanner();cb(txt);};
 $('#scManual').onsubmit=e=>{e.preventDefault();finish($('#scIn').value);};
 if(window.innerWidth>900)setTimeout(()=>{const i=$('#scIn');if(i)i.focus();},60);
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Kamera tidak tersedia di browser atau koneksi ini (butuh HTTPS)');
  if('BarcodeDetector' in window){
   let formats=['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','codabar'];
   try{const sup=await window.BarcodeDetector.getSupportedFormats();const f=formats.filter(x=>sup.includes(x));if(f.length)formats=f;}catch(_){}
   const det=new window.BarcodeDetector({formats});
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
   me.stop.push(()=>stream.getTracks().forEach(t=>t.stop()));
   if(SCAN!==me){stream.getTracks().forEach(t=>t.stop());return;}
   const v=$('#scV');v.hidden=false;v.srcObject=stream;await v.play();
   msg('Arahkan kamera ke barcode atau QR code');
   const timer=setInterval(async()=>{if(v.readyState<2||done)return;try{const r=await det.detect(v);if(r.length)finish(r[0].rawValue);}catch(_){}},250);
   me.stop.push(()=>clearInterval(timer));
  }else{
   await loadScript(CDN_H5QR);
   if(SCAN!==me)return;
   $('#scR').hidden=false;$('#scFrame').hidden=true;
   const h=new window.Html5Qrcode('scR');
   const stopH=()=>{h.stop().then(()=>h.clear()).catch(()=>{});};
   me.stop.push(stopH);
   await h.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},finish,()=>{});
   if(SCAN!==me){stopH();return;}
   msg('Arahkan kamera ke barcode atau QR code');
  }
 }catch(err){
  console.warn('Scanner:',err);
  if(SCAN!==me)return;
  msg(err&&err.name==='NotAllowedError'?'Akses kamera ditolak. Izinkan kamera di browser, atau ketik kode secara manual.':`${(err&&err.message)||'Kamera tidak dapat dibuka'}. Anda tetap bisa mengetik kode atau memakai alat scanner.`);
  const vw=$('#scView');if(vw)vw.hidden=true;
 }
}

 const loans=S.d.peminjaman.filter(l=>!l.tgl_kembali&&(b?l.buku_id===b.id:l.anggota_id===m.id));
 if(!loans.length)return toast(b?`Tidak ada pinjaman aktif untuk "${b.judul}"`:`${m.nama} tidak memiliki pinjaman aktif`,'err');

function readLogo(file){
 return new Promise((res,rej)=>{
  if(file.size>5*1024*1024)return rej(new Error('Ukuran file maksimal 5 MB'));
  const fr=new FileReader();
  fr.onerror=()=>rej(new Error('Gagal membaca file'));
  fr.onload=()=>{const img=new Image();
   img.onerror=()=>rej(new Error('File bukan gambar yang valid'));
   img.onload=()=>{const M=256,sc=Math.min(1,M/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/png'));};
   img.src=fr.result;};
  fr.readAsDataURL(file);
 });
}

 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.scan){e.preventDefault();applyScan(e.target.dataset.scan,e.target.value,{target:e.target.dataset.target});}
 if(e.key==='Enter'&&e.target.id==='q'&&S.d&&S.d.buku){const b=resolveBook(e.target.value);if(b&&String(b.kode_buku||'').toLowerCase()===e.target.value.trim().toLowerCase()){e.preventDefault();bookDetail(b.id);}}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('bcard')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
 if(e.target.id!=='q')return;
 S.q=e.target.value;
 if(!SEARCHABLE[S.role].includes(S.page)){S.page=S.role==='admin'?'buku':'katalog';renderNav();renderFab();}
 renderPage();
});
document.addEventListener('submit',async e=>{
 const f=e.target;
 if(f.id==='frmLogin'){e.preventDefault();return doLogin();}
 if(f.id==='frmLaporan'){e.preventDefault();const fd=Object.fromEntries(new FormData(f));if(fd.from>fd.to)return toast('Tanggal awal harus sebelum tanggal akhir','err');S.f.from=fd.from;S.f.to=fd.to;renderPage();return;}
 if(f.id==='frmPeng'){e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  return run(async()=>{
   const logo=(fd.logo_url||'').trim(),tx=k=>(fd[k]||'').trim();
   if(logo&&!safeImg(logo))throw new Error('Logo harus berupa URL http(s) atau gambar yang diunggah');
   if(logo.length>400000)throw new Error('Logo terlalu besar, gunakan gambar yang lebih kecil');
   const row={nama_aplikasi:tx('nama_aplikasi')||'Perpustakaan Digital',nama_sekolah:tx('nama_sekolah'),logo_url:logo,alamat:tx('alamat'),kepala_sekolah:tx('kepala_sekolah'),nip_kepala_sekolah:tx('nip_kepala_sekolah'),kepala_perpus:tx('kepala_perpus'),nip_kepala_perpus:tx('nip_kepala_perpus'),lama_pinjam_hari:Math.max(1,parseInt(fd.lama_pinjam_hari)||7),denda_per_hari:Math.max(0,parseInt(fd.denda_per_hari)||0),maks_pinjam:Math.max(1,parseInt(fd.maks_pinjam)||3),maks_perpanjang:Math.max(0,parseInt(fd.maks_perpanjang)||0)};
   if(S.settings.id)await A.upd('pengaturan',S.settings.id,row);else await A.ins('pengaturan',row);
   await refresh();applyBranding();toast('Pengaturan disimpan');
  });}
 if(f.id==='frmPw'){e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  if(fd.nw!==fd.nw2)return toast('Konfirmasi password baru tidak sama','err');
  if(fd.nw.length<6)return toast('Password baru minimal 6 karakter','err');
  return run(async()=>{await MEM.changePw(fd.old,fd.nw);f.reset();toast('Password berhasil diubah');});}
});

/* =====================================================================
   LOGIN / LOGOUT / INIT
   ===================================================================== */
document.addEventListener('change',async e=>{
 if(e.target.id==='pgDate'){S.f.tgl=e.target.value||todayStr();renderPage();return;}
 if(e.target.id==='logoFile'&&e.target.files&&e.target.files[0]){
  try{busy(true);const data=await readLogo(e.target.files[0]);$('#logoVal').value=data;$('#logoUrl').value='';setLogoPreview(data);}
  catch(err){toast(err.message||'Gagal memuat logo','err');e.target.value='';}
  finally{busy(false);}
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='logoUrl'){const v=e.target.value.trim();const h=$('#logoVal');if(h)h.value=v;setLogoPreview(v);}
});
function setupLoginLabels(){
 const admin=S.loginRole==='admin';
 $('#lg-l1').textContent=admin?'Email Admin':'Username / ID Anggota';
 const u=$('#lg-u');u.type=admin?'email':'text';u.autocomplete='username';u.value='';$('#lg-p').value='';
 $('#lg-err').hidden=true;
 const h=$('#lg-hint');
 if(IS_PREVIEW){h.hidden=false;h.innerHTML=admin?'<b>Mode preview.</b> Admin: <b>admin@perpus.id</b> / <b>admin123</b>':'<b>Mode preview.</b> Anggota: <b>anggota</b> / <b>anggota123</b> (atau <b>budi</b> / <b>password123</b>)';}
 else{h.hidden=!admin;h.innerHTML=admin?'Admin masuk memakai akun Supabase Authentication.':'';}
}
const showLoginErr=m=>{const e=$('#lg-err');e.textContent=m;e.hidden=false;};
async function doLogin(){
 const id=$('#lg-u').value.trim(),pw=$('#lg-p').value,btn=$('#lg-btn');
 $('#lg-err').hidden=true;btn.disabled=true;btn.textContent='Memproses...';busy(true);
 try{
  if(!IS_PREVIEW&&!sb)throw new Error('Supabase belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY.');
  if(S.loginRole==='admin'){
   if(IS_PREVIEW){if(id.toLowerCase()!=='admin@perpus.id'||pw!=='admin123')throw new Error('Email atau password admin salah');await startAdmin({email:id});}
   else{const {data,error}=await sb.auth.signInWithPassword({email:id,password:pw});if(error)throw new Error('Email atau password admin salah');await startAdmin(data.user);}
  }else{
   const r=await MEM.login(id,pw);S.user=r.user;S.hash=r.hash;
   try{sessionStorage.setItem('perpus_member',JSON.stringify(r));}catch(_){}
   await startMember();
  }
 }catch(e){showLoginErr(e.message||'Gagal masuk');}
 finally{busy(false);btn.disabled=false;btn.textContent='Masuk';}
}
async function startAdmin(u){
 if(!IS_PREVIEW){
  const {data:ok,error:er}=await sb.rpc('is_admin');
  if(er||!ok){try{await sb.auth.signOut();}catch(_){}throw new Error(`Akun ${u.email} belum terdaftar sebagai admin. Jalankan di SQL Editor Supabase: insert into admin_users (email) values ('${String(u.email).toLowerCase()}');`);}
 }
 S.role='admin';S.user={nama:(u.email||'admin').split('@')[0],email:u.email};
 await autoSetupDatabase();await loadAdminData();enterApp('dashboard');
}
async function startMember(){
 S.role='anggota';await autoSetupDatabase();await loadMemberData();enterApp('beranda');
}
function enterApp(page){
 S.page=page;S.q='';S.f={kat:'',sirk:'aktif',tab:'aktif',from:'',to:'',kt:'kategori',tgl:todayStr()};
 $('#view-login').hidden=true;$('#view-app').hidden=false;
 applyBranding();
 render();
}
async function doLogout(){
 if(S.role==='admin'&&!IS_PREVIEW&&sb){try{await sb.auth.signOut();}catch(_){}}
 try{sessionStorage.removeItem('perpus_member');}catch(_){}
 S.role=null;S.user=null;S.hash=null;S.d={};
 $('#view-app').hidden=true;$('#view-login').hidden=false;setupLoginLabels();
}

/* ===== PWA (manifest dinamis + service worker via Blob) ===== */
function setupPWA(){
 try{
  const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#4F63E6"/><path d="M96 130h110a50 50 0 0 1 50 50v206a40 40 0 0 0-40-40H96z" fill="#fff"/><path d="M416 130H306a50 50 0 0 0-50 50v206a40 40 0 0 1 40-40h120z" fill="#DDE2FF"/></svg>');
  const m={name:'Perpustakaan Digital',short_name:'Perpus',start_url:location.href.split('#')[0],scope:location.href.split('#')[0],display:'standalone',orientation:'portrait',background_color:'#ffffff',theme_color:'#4F63E6',icons:[{src:icon,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]};
  let l=document.querySelector('link[rel="manifest"]');if(!l){l=document.createElement('link');l.rel='manifest';document.head.appendChild(l);}
  l.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));
  if(!document.querySelector('meta[name="theme-color"]')){const t=document.createElement('meta');t.name='theme-color';t.content='#4F63E6';document.head.appendChild(t);}
  if(!document.querySelector('link[href*="family=Poppins"]')){const f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap';document.head.appendChild(f);}
 }catch(e){console.warn('PWA manifest:',e);}
 try{
  if('serviceWorker' in navigator&&location.protocol==='https:'){
   const swCode=`const C='perpus-v1';
self.addEventListener('install',e=>{self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});
self.addEventListener('fetch',e=>{
 const r=e.request;
 if(r.method!=='GET'||r.url.includes('supabase.co'))return;
 e.respondWith(fetch(r).then(res=>{const cp=res.clone();caches.open(C).then(c=>c.put(r,cp)).catch(()=>{});return res;}).catch(()=>caches.match(r)));
});`;
   const url=URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}));
   navigator.serviceWorker.register(url).catch(err=>console.info('Service worker tidak didukung di lingkungan ini:',err&&err.message));
  }
 }catch(e){console.info('Service worker dilewati:',e&&e.message);}
}

async function init(){
 document.documentElement.classList.add('perpus-lock');injectCss();
 $('#ic-logout').innerHTML=ic('logout');$('#ic-search').innerHTML=ic('search');$('#ic-bell').innerHTML=ic('bell');
 $('#lg-illu').innerHTML=ILLU.sky;
 setupPWA();
 busy(true);
 try{
  if(IS_PREVIEW){await autoSetupDatabase();}
  else if(SUPABASE_URL.startsWith('http')&&!SUPABASE_ANON_KEY.includes('ANON_KEY_ANDA')){
   const {createClient}=await import(CDN_SUPABASE);
   sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  }
  setupLoginLabels();
  await loadPublicSettings();applyBranding();
  // pulihkan sesi
  if(!IS_PREVIEW&&sb){
   const {data}=await sb.auth.getSession();
   if(data&&data.session){S.loginRole='admin';await startAdmin(data.session.user);return;}
  }
  let saved=null;try{saved=JSON.parse(sessionStorage.getItem('perpus_member')||'null');}catch(_){}
  if(saved&&saved.user&&saved.hash&&(IS_PREVIEW||sb)){
   try{S.user=saved.user;S.hash=saved.hash;await startMember();return;}catch(_){S.user=null;S.hash=null;}
  }
  $('#view-login').hidden=false;
  if(!IS_PREVIEW&&!sb)showLoginErr('Supabase belum dikonfigurasi. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian atas skrip, lalu muat ulang.');
 }catch(e){
  console.error(e);$('#view-login').hidden=false;showLoginErr('Gagal memulai aplikasi: '+(e.message||e));
 }finally{busy(false);}
}
init();
</script>
